<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>スマスロ SAOⅡ 設定推測ノート</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#2b3650;--text:#f3f6ff;--muted:#a9b4cc;--accent:#7dd3fc;--good:#86efac;--warn:#fcd34d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:22px 16px 16px;background:linear-gradient(135deg,#172554,#111827);border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:var(--muted);font-size:13px}.wrap{max-width:760px;margin:auto;padding:14px 12px 42px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}.tab,button{border:1px solid var(--line);border-radius:11px;padding:11px 8px;background:#202b43;color:var(--text);font-weight:650;font-size:14px}.tab.active{background:#075985;border-color:#38bdf8}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0}.panel h2{font-size:18px;margin:0 0 10px}.panel h3{font-size:15px;margin:15px 0 7px}.note{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#0d1527;color:var(--text);border-radius:9px;padding:11px;font-size:16px;min-width:0}input[type=checkbox]{width:19px;height:19px;accent-color:#38bdf8}.check{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid #263149}.check:last-child{border:0}.check span{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:110px}.primary{background:#0369a1;border-color:#38bdf8}.danger{background:#4c1d2c;border-color:#9f435d}.metric{background:#0d1527;border:1px solid var(--line);border-radius:10px;padding:12px}.metric strong{display:block;font-size:20px}.metric small{color:var(--muted)}.hidden{display:none!important}.result{border-left:3px solid var(--accent);padding:10px 12px;background:#0d1527;border-radius:7px;margin-top:10px}.exit-screen-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.exit-card{background:#0d1527;border:1px solid var(--line);border-radius:11px;overflow:hidden;min-width:0}.exit-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#202b43;cursor:pointer}.exit-name{font-weight:700;font-size:14px;padding:7px 8px 0}.exit-hint{font-size:11px;color:var(--muted);padding:0 8px;min-height:32px}.exit-controls{display:flex;align-items:center;gap:6px;padding:7px 8px 9px}.exit-controls button{padding:5px 9px;min-width:36px}.exit-count{flex:1;text-align:center;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}.tag{display:inline-block;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);margin:2px}.footer{font-size:12px;color:var(--muted);padding:8px 2px}button:active{transform:scale(.99)}@media(min-width:600px){.wrap{padding:20px}.panel{padding:18px}.exit-screen-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>スマスロ SAOⅡ 設定推測ノート</h1></header>
<main class="wrap">
<div class="tabs" role="tablist"><button type="button" class="tab active" data-tab="setting" aria-selected="true">設定推測</button><button type="button" class="tab" data-tab="log" aria-selected="false">実戦記録</button></div>
<section id="setting" class="view">
<div class="panel"><h2>設定推測の実戦データ</h2>
<div class="grid"><div class="field"><label for="date">日付</label><input id="date" type="date"></div><div class="field"><label for="hall">ホール・台番号（任意）</label><input id="hall" placeholder="例：○○店 123番"></div></div>
<div class="grid"><div class="field"><label for="normalGames">通常時ゲーム数</label><input id="normalGames" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="czTotal">CZ回数</label><input id="czTotal" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="atTotal">AT初当たり回数</label><input id="atTotal" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="strongB">強チャンス目B回数（不明なら空欄）</label><input id="strongB" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="endCount">THE ENDモード開始回数（不明なら空欄）</label><input id="endCount" type="number" min="0" inputmode="numeric" placeholder="任意"></div></div>
<div class="panel" id="exitScreenPanel"><h2>AT終了画面カウンター</h2><div id="exitScreenGrid" class="exit-screen-grid"></div><div class="actions"><button type="button" id="clearExitScreens">終了画面カウントをリセット</button></div></div>
<div class="panel"><h2>AT初当たり時のステージ</h2><div class="grid"><div class="field"><label for="stageWilderness">荒野の回数</label><input id="stageWilderness" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="stageBuggy">バギーの回数</label><input id="stageBuggy" type="number" min="0" inputmode="numeric" placeholder="0"></div></div>
<h2>スナイパーチャンス：デス・ガン選択回数</h2><div class="grid"><div class="field"><label for="dg1Total">1戦目の選択回数（総数）</label><input id="dg1Total" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="dg1Count">1戦目のデス・ガン回数</label><input id="dg1Count" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="dg2Total">2戦目の選択回数（総数）</label><input id="dg2Total" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="dg2Count">2戦目のデス・ガン回数</label><input id="dg2Count" type="number" min="0" inputmode="numeric" placeholder="任意"></div></div>
<h2>CZ失敗時の「曠野の決闘」</h2><div class="grid"><div class="field"><label for="czFailTotal">CZ失敗回数</label><input id="czFailTotal" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="duelCount">曠野の決闘 出現回数</label><input id="duelCount" type="number" min="0" inputmode="numeric" placeholder="任意"></div></div>
<h2>強チェリー成立時のCZ当選</h2><div class="grid"><div class="field"><label for="lowStrongCherry">低確中の強チェリー回数</label><input id="lowStrongCherry" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="lowStrongCherryHit">低確中のCZ当選回数</label><input id="lowStrongCherryHit" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="highStrongCherry">高確中の強チェリー回数</label><input id="highStrongCherry" type="number" min="0" inputmode="numeric" placeholder="任意"></div><div class="field"><label for="highStrongCherryHit">高確中のCZ当選回数</label><input id="highStrongCherryHit" type="number" min="0" inputmode="numeric" placeholder="任意"></div></div></div><div class="grid"><div class="metric"><small>CZ実測確率</small><strong id="czRate">—</strong><small id="czCountText">分母：通常時0G</small></div><div class="metric"><small>AT初当たり実測確率</small><strong id="atRate">—</strong><small id="atCountText">分母：通常時0G</small></div></div>
<div id="settingProb" class="result">通常時ゲーム数とCZ・AT回数を入力すると、設定別の参考値を表示します。</div><div class="field"><label for="minSetting">確定演出などで分かっている最低設定</label><select id="minSetting"><option value="1">未指定</option><option value="2">設定2以上</option><option value="3">設定3以上</option><option value="4">設定4以上</option><option value="5">設定5以上</option><option value="6">設定6確定</option></select></div><h3>確認できた設定示唆</h3>
<div class="field"><label for="hint">示唆内容（自分で確認した表記を入力）</label><input id="hint" placeholder="例：終了画面の示唆内容"></div>
<div class="field"><label for="hintStrength">根拠の区分</label><select id="hintStrength"><option value="未確認">解析未確認・区分不明</option><option value="高設定示唆">高設定示唆</option><option value="設定確定">設定確定（確定条件を要確認）</option><option value="否定示唆">特定設定の否定示唆</option></select></div>
<div class="actions"><button class="primary" id="addHint">示唆を記録</button></div><div id="hintsList"></div>
<div class="result" id="settingResult"></div>
<div class="actions"><button class="primary" id="saveSetting">設定データを保存</button><button id="resetSetting">数値をリセット</button></div>
</div>
<div class="panel" id="endingMiniPanel"><h2>エンディング中のミニキャラ</h2><div class="grid"><div class="field"><label for="edSinon">シノン（偶数示唆）</label><input id="edSinon" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edKirito">キリト（奇数示唆）</label><input id="edKirito" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edSilica">シリカ（偶数示唆・強）</label><input id="edSilica" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edLizbet">リズベット（奇数示唆・強）</label><input id="edLizbet" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edGunslingerX">銃士X（高設定示唆）</label><input id="edGunslingerX" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edAsuna">アスナ（高設定示唆・強）</label><input id="edAsuna" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edShino">詩乃（設定4以上）</label><input id="edShino" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="edSinonKirito">シノン＆キリト（設定6）</label><input id="edSinonKirito" type="number" min="0" inputmode="numeric" placeholder="0"></div></div><div class="actions"><button type="button" id="clearEndingMini">ミニキャラ数をリセット</button></div></div><div class="panel" id="trophyPanel"><h2>コパンダトロフィーカウンター</h2><div class="grid"><div class="field"><label for="trophyBronze">銅トロフィー</label><input id="trophyBronze" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="trophySilver">銀トロフィー</label><input id="trophySilver" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="trophyGold">金トロフィー</label><input id="trophyGold" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="trophyLightning">イナズマトロフィー</label><input id="trophyLightning" type="number" min="0" inputmode="numeric" placeholder="0"></div><div class="field"><label for="trophyRainbow">虹トロフィー</label><input id="trophyRainbow" type="number" min="0" inputmode="numeric" placeholder="0"></div></div><div class="actions"><button type="button" id="clearTrophies">トロフィー数をリセット</button></div></div>
</section>
<section id="log" class="view hidden">
<div class="panel"><h2>保存した実戦記録</h2>
<div class="actions"><button class="primary" id="export">JSONでバックアップ</button><button id="importBtn">バックアップを読み込む</button><input class="hidden" id="importFile" type="file" accept="application/json"></div>
<div id="records" style="margin-top:12px"></div><div class="actions"><button class="danger" id="deleteAll">全記録を削除</button></div></div>
</section>
<div class="footer">推定値は参考情報です。遊技判断はご自身の責任で行ってください。</div>
</main>
<script>
const $=id=>document.getElementById(id);
const STORE='sao2-hanbetsu-v01';
let data=JSON.parse(localStorage.getItem(STORE)||'{"records":[],"hints":[]}');
const today=new Date();$('date').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
document.querySelectorAll('.tab').forEach(b=>{b.addEventListener('click',event=>{event.preventDefault();const target=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-selected',String(active))});document.querySelectorAll('.view').forEach(x=>{const visible=x.id===target;x.classList.toggle('hidden',!visible);x.style.display=visible?'block':'none'});if(target==='log'){try{renderRecords()}catch(err){const box=$('records');if(box)box.textContent='記録の表示でエラーが発生しました。ページを再読み込みしてください。';console.error(err)}}},false)});
const exitScreenDefs=[{id:'default',name:'キリト＆シノン',hint:'デフォルト',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172855_6a1d42c7ee175.jpg'},{id:'uniform',name:'制服',hint:'奇数設定示唆',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172859_6a1d42cb4575e.jpg'},{id:'sofa',name:'ソファー',hint:'偶数設定示唆',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172901_6a1d42cdc787b.jpg'},{id:'komorebi',name:'木漏れ日',hint:'高設定示唆',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172905_6a1d42d170646.jpg'},{id:'matsuri',name:'夏祭り',hint:'高設定示唆（強）',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172907_6a1d42d3d2e1d.jpg'},{id:'childhood',name:'幼少期',hint:'設定5以上示唆',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172910_6a1d42d69d442.jpg'},{id:'shirt',name:'ワイシャツ',hint:'設定2以上濃厚',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172913_6a1d42d934fb6.jpg'},{id:'bath',name:'お風呂',hint:'設定3以上濃厚',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172915_6a1d42dbce7ef.jpg'},{id:'swimsuit',name:'水着',hint:'設定4以上濃厚',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172920_6a1d42e038032.jpg'},{id:'pajamas',name:'パジャマ',hint:'設定6濃厚',img:'https://image.nana-press.com/kaiseki/machine/1158/20260601172922_6a1d42e2b7e74.jpg'}];
let exitScreenCounts={};
function renderExitScreens(){const el=$('exitScreenGrid');if(!el)return;el.innerHTML=exitScreenDefs.map(s=>'<div class="exit-card"><img class="exit-thumb" data-exit-add="'+s.id+'" src="'+s.img+'" alt="'+esc(s.name)+'" loading="lazy"><div class="exit-name">'+esc(s.name)+'</div><div class="exit-hint">'+esc(s.hint)+'</div><div class="exit-controls"><button type="button" data-exit-minus="'+s.id+'">−</button><span class="exit-count">'+(exitScreenCounts[s.id]||0)+'</span><button type="button" class="primary" data-exit-add="'+s.id+'">＋</button></div></div>').join('');el.querySelectorAll('[data-exit-add]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.exitAdd;exitScreenCounts[id]=(exitScreenCounts[id]||0)+1;renderExitScreens();calcSetting()}));el.querySelectorAll('[data-exit-minus]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.exitMinus;exitScreenCounts[id]=Math.max(0,(exitScreenCounts[id]||0)-1);renderExitScreens();calcSetting()}))}
$('clearExitScreens').addEventListener('click',()=>{if(confirm('AT終了画面のカウントをすべて0に戻しますか？')){exitScreenCounts={};renderExitScreens();calcSetting()}});function num(id){return Math.max(0,Number($(id).value)||0)}
function rate(g,n){return g>0&&n>0?'1/'+(g/n).toFixed(1):'—'}
const settingRates={cz:[238.4,232.3,232.7,218.9,225.2,191.7],at:[386.2,364.3,368.1,326.8,340.6,269.6],strongB:[1057,993,936.2,885.6,840.2,799.2],end:[20177.5,17579.1,17586.3,13784.5,11459,7077.2]};
function calcSetting(){const g=num('normalGames'),czRaw=$('czTotal').value,atRaw=$('atTotal').value,cz=num('czTotal'),at=num('atTotal'),bRaw=$('strongB').value,eRaw=$('endCount').value,b=num('strongB'),e=num('endCount');$('czRate').textContent=rate(g,cz);$('atRate').textContent=rate(g,at);$('czCountText').textContent='分母：通常時'+g+'G／CZ '+cz+'回';$('atCountText').textContent='分母：通常時'+g+'G／AT '+at+'回';
const screenCounts=exitScreenCounts||{};
const hasScreenCounts=Object.values(screenCounts).some(v=>Number(v)>0);
const extraIds=['stageWilderness','stageBuggy','dg1Total','dg1Count','dg2Total','dg2Count','czFailTotal','duelCount','lowStrongCherry','lowStrongCherryHit','highStrongCherry','highStrongCherryHit','trophyBronze','trophySilver','trophyGold','trophyLightning','trophyRainbow','edSinon','edKirito','edSilica','edLizbet','edGunslingerX','edAsuna','edShino','edSinonKirito'];
const hasExtraInput=extraIds.some(id=>$(id).value!=='');
const usable=(g>0&&(czRaw!==''||atRaw!==''||bRaw!==''||eRaw!==''))||hasScreenCounts||hasExtraInput;
if(!usable){$('settingProb').textContent='通常時ゲーム数と、記録したい項目を入力してください。';return}
const min=Number($('minSetting').value||1),logs=[];
const screenRates=[
[60,55,52,48,44,42], // デフォルト
[20,10,20,12,16,12], // 制服
[10,21,10,20,12,18], // ソファー
[6,8,10,12,14,15], // 木漏れ日
[3,4,5,6,8,10], // 夏祭り
[1,2,3,2,6,3] // 幼少期
];
const softScreenIds=['default','uniform','sofa','komorebi','matsuri','childhood'];
const confirmedMin={shirt:2,bath:3,swimsuit:4,pajamas:6};
const trophyMinimum={trophyBronze:2,trophySilver:3,trophyGold:4,trophyLightning:5,trophyRainbow:6};
 const endingMiniRates={edSinon:[21,38,21,36,22,31],edKirito:[38,21,36,21,31,22],edSilica:[8,20,8,16,8,13],edLizbet:[24,9,20,9,17,8],edGunslingerX:[6,8,10,12,14,16],edAsuna:[3,4,5,6,8,10]};
for(let i=0;i<6;i++){
 if(i+1<min){logs.push(-Infinity);continue}
 let l=0,used=0,extraUsed=false;
 function add(k,rate){if(k!==null){const lambda=g/rate;l+=k*Math.log(lambda)-lambda;used++}}
 function addBinomial(success,total,p){if(total>0){const k=Math.min(success,total);l+=k*Math.log(p)+(total-k)*Math.log(1-p);extraUsed=true}}
 if(czRaw!==''&&g>0)add(cz,settingRates.cz[i]);
 if(atRaw!==''&&g>0)add(at,settingRates.at[i]);
 if(bRaw!==''&&g>0)add(b,settingRates.strongB[i]);
 if(eRaw!==''&&g>0)add(e,settingRates.end[i]);
 const wilderness=num('stageWilderness'),buggy=num('stageBuggy'),stageTotal=wilderness+buggy;
 if(stageTotal>0){const pW=i%2===0?0.6:0.4;l+=wilderness*Math.log(pW)+buggy*Math.log(1-pW);extraUsed=true}
 const dgTotal=Math.min(num('dg1Total'),num('dg1Count'))+Math.min(num('dg2Total'),num('dg2Count'));
 if(dgTotal>0&&i===4){l+=Math.min(dgTotal,5)*Math.log(1.3);extraUsed=true}
 const failN=num('czFailTotal'),duelK=Math.min(num('duelCount'),failN),duelRates=[128,110,95,82,72,64];
 if($('czFailTotal').value!==''&&$('duelCount').value!==''&&failN>0)addBinomial(duelK,failN,1/duelRates[i]);
 const lowN=num('lowStrongCherry'),lowHit=Math.min(num('lowStrongCherryHit'),lowN);
 const highN=num('highStrongCherry'),highHit=Math.min(num('highStrongCherryHit'),highN);
 const lowRates=[0.20,0.21,0.20,0.25,0.20,0.33],highRates=[0.50,0.51,0.52,0.55,0.58,0.60];
 if($('lowStrongCherry').value!==''&&$('lowStrongCherryHit').value!=='')addBinomial(lowHit,lowN,lowRates[i]);if($('highStrongCherry').value!==''&&$('highStrongCherryHit').value!=='')addBinomial(highHit,highN,highRates[i]);
 let excluded=false;
 for(const [id,minSetting] of Object.entries(confirmedMin)){if((Number(screenCounts[id])||0)>0&&i+1<minSetting)excluded=true}
for(const [id,minSetting] of Object.entries(trophyMinimum)){if(num(id)>0&&i+1<minSetting)excluded=true}
  if(num('edShino')>0&&i+1<4)excluded=true;if(num('edSinonKirito')>0&&i+1<6)excluded=true;
 if(excluded){logs.push(-Infinity);continue}
 let screenUsed=0;
 softScreenIds.forEach((id,j)=>{const count=Number(screenCounts[id])||0;if(count>0){l+=count*Math.log(screenRates[j][i]/100);screenUsed+=count}});
  for(const [id,rates] of Object.entries(endingMiniRates)){const count=num(id);if(count>0){l+=count*Math.log(rates[i]/100);screenUsed+=count;extraUsed=true}}
 if(used===0&&screenUsed===0){l=0}
 logs.push((used>0||screenUsed>0||extraUsed)?l:0)
}
const finiteLogs=logs.filter(Number.isFinite);
if(!finiteLogs.length){$('settingProb').textContent='入力した終了画面の示唆条件と、最低設定の指定が矛盾しています。入力を確認してください。';return}
const max=Math.max(...finiteLogs);const probs=logs.map(v=>Number.isFinite(v)?Math.exp(v-max):0);const total=probs.reduce((s,v)=>s+v,0)||1;const pct=probs.map(v=>v/total*100);
const usedLabels=[czRaw!==''&&g>0?'CZ初当たり':'',atRaw!==''&&g>0?'AT初当たり':'',bRaw!==''&&g>0?'強チャンス目B':'',eRaw!==''&&g>0?'THE ENDモード':'',hasScreenCounts?'AT終了画面':'',(num('stageWilderness')+num('stageBuggy'))>0?'AT開始ステージ':'',(Math.min(num('dg1Total'),num('dg1Count'))+Math.min(num('dg2Total'),num('dg2Count')))>0?'デス・ガン選択（弱補正）':'',num('czFailTotal')>0?'曠野の決闘':'',num('lowStrongCherry')>0?'低確中の強チェリーCZ当選率':'',num('highStrongCherry')>0?'高確中の強チェリーCZ当選率':'',(num('trophyBronze')+num('trophySilver')+num('trophyGold')+num('trophyLightning')+num('trophyRainbow'))>0?'コパンダトロフィー':'',(num('edSinon')+num('edKirito')+num('edSilica')+num('edLizbet')+num('edGunslingerX')+num('edAsuna')+num('edShino')+num('edSinonKirito'))>0?'エンディング中ミニキャラ':''].filter(Boolean);
$('settingProb').innerHTML='<b>参考推定（各設定を同じ事前確率と仮定）</b><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px">'+pct.map((p,i)=>'<div class="metric"><small>設定'+(i+1)+'</small><strong>'+p.toFixed(1)+'%</strong><small>'+(!Number.isFinite(logs[i])?'示唆条件で除外':'参考値')+'</small></div>').join('')+'</div>'}
['normalGames','czTotal','atTotal','strongB','endCount','minSetting','stageWilderness','stageBuggy','dg1Total','dg1Count','dg2Total','dg2Count','czFailTotal','duelCount','lowStrongCherry','lowStrongCherryHit','highStrongCherry','highStrongCherryHit','trophyBronze','trophySilver','trophyGold','trophyLightning','trophyRainbow','edSinon','edKirito','edSilica','edLizbet','edGunslingerX','edAsuna','edShino','edSinonKirito'].forEach(id=>$(id).addEventListener('input',calcSetting));
$('clearTrophies').onclick=()=>{['trophyBronze','trophySilver','trophyGold','trophyLightning','trophyRainbow'].forEach(id=>$(id).value='');calcSetting()};
$('clearEndingMini').onclick=()=>{['edSinon','edKirito','edSilica','edLizbet','edGunslingerX','edAsuna','edShino','edSinonKirito'].forEach(id=>$(id).value='');calcSetting()};
$('saveSetting').onclick=()=>{data.records.unshift({type:'setting',date:$('date').value,hall:$('hall').value,games:num('normalGames'),cz:num('czTotal'),at:num('atTotal'),strongB:$('strongB').value===''?null:num('strongB'),endCount:$('endCount').value===''?null:num('endCount'),stageWilderness:num('stageWilderness'),stageBuggy:num('stageBuggy'),dg1Total:num('dg1Total'),dg1Count:num('dg1Count'),dg2Total:num('dg2Total'),dg2Count:num('dg2Count'),czFailTotal:num('czFailTotal'),duelCount:num('duelCount'),lowStrongCherry:num('lowStrongCherry'),lowStrongCherryHit:num('lowStrongCherryHit'),highStrongCherry:num('highStrongCherry'),highStrongCherryHit:num('highStrongCherryHit'),trophyBronze:num('trophyBronze'),trophySilver:num('trophySilver'),trophyGold:num('trophyGold'),trophyLightning:num('trophyLightning'),trophyRainbow:num('trophyRainbow'),edSinon:num('edSinon'),edKirito:num('edKirito'),edSilica:num('edSilica'),edLizbet:num('edLizbet'),edGunslingerX:num('edGunslingerX'),edAsuna:num('edAsuna'),edShino:num('edShino'),edSinonKirito:num('edSinonKirito'),hints:[...data.hints],exitScreenCounts:{...exitScreenCounts},savedAt:new Date().toISOString()});persist();alert('設定データを保存しました');};
$('resetSetting').onclick=()=>{['normalGames','czTotal','atTotal','strongB','endCount','stageWilderness','stageBuggy','dg1Total','dg1Count','dg2Total','dg2Count','czFailTotal','duelCount','lowStrongCherry','lowStrongCherryHit','highStrongCherry','highStrongCherryHit','trophyBronze','trophySilver','trophyGold','trophyLightning','trophyRainbow','edSinon','edKirito','edSilica','edLizbet','edGunslingerX','edAsuna','edShino','edSinonKirito'].forEach(id=>$(id).value='');$('minSetting').value='1';calcSetting()};
$('addHint').onclick=()=>{const name=$('hint').value.trim();if(!name){alert('示唆内容を入力してください');return}data.hints.push({name,strength:$('hintStrength').value,date:$('date').value});$('hint').value='';persist();renderHints()};
function renderHints(){const el=$('hintsList');if(!data.hints.length){el.textContent='まだ示唆は記録されていません。';return}el.innerHTML=data.hints.map((h,i)=>'<div class="check"><span><b>'+esc(h.name)+'</b><br><span class="tag">'+esc(h.strength)+'</span> <span class="tag">'+esc(h.date||'日付なし')+'</span></span><button data-remove="'+i+'" style="flex:0 0 auto;padding:6px 10px">削除</button></div>').join('');el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{data.hints.splice(Number(b.dataset.remove),1);persist();renderHints()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem(STORE,JSON.stringify(data));renderRecords()}
function renderRecords(){const el=$('records');if(!data.records.length){el.innerHTML='';return}el.innerHTML=data.records.map((r,i)=>'<div class="panel"><b>'+esc(r.date)+'｜'+esc(r.hall||'ホール未入力')+'｜'+(r.type==='reset'?'朝一・リセット記録':'設定推測記録')+'</b><button data-del="'+i+'" class="danger">この記録を削除</button></div>').join('');el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.records.splice(Number(b.dataset.del),1);persist()})}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sao2-hanbetsu-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const v=JSON.parse(await f.text());if(!Array.isArray(v.records)||!Array.isArray(v.hints))throw Error('format');if(!confirm('現在の記録をバックアップ内容で置き換えますか？'))return;data=v;persist();renderHints();alert('読み込みました')}catch{alert('バックアップファイルを読み込めませんでした')}e.target.value=''};
$('deleteAll').onclick=()=>{if(confirm('保存した実戦記録と示唆をすべて削除しますか？')){data={records:[],hints:[]};persist();renderHints()}};
calcSetting();renderHints();renderRecords();renderExitScreens();
